{% extends "01_base.html" %}

{% block title %}Accesso - Horeca Suite{% endblock %}

{% block styles %}
{{ super() }}
<style>
  .sidebar, .top-navbar, footer, .mobile-bottom-nav, #aiAgentFab, #aiAgentDrawer, #sidebarMobileBackdrop {
    display: none !important;
  }
  main.container {
    margin-left: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
    padding: 1.5rem !important;
  }
  body {
    padding-bottom: 0 !important;
    background: radial-gradient(850px circle at 15% 15%, rgba(79, 70, 229, 0.22), transparent 55%),
                radial-gradient(750px circle at 85% 85%, rgba(14, 165, 233, 0.18), transparent 55%),
                #060a14 !important;
  }
  .login-glass-card {
    width: 100%;
    max-width: 430px;
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 2.5rem 2.25rem;
    box-shadow: 0 28px 60px -15px rgba(0, 0, 0, 0.7);
    color: #f8fafc;
  }
  .login-glass-card h1, .login-glass-card h4, .login-glass-card label {
    color: #f8fafc !important;
  }
  .login-glass-card .form-control {
    background-color: rgba(255, 255, 255, 0.06) !important;
    border: 1px solid rgba(255, 255, 255, 0.14) !important;
    color: #ffffff !important;
    padding: 0.72rem 1rem;
    border-radius: 12px;
  }
  .login-glass-card .form-control:focus {
    background-color: rgba(255, 255, 255, 0.1) !important;
    border-color: #818cf8 !important;
    box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25) !important;
  }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 3rem);">
  <div class="login-glass-card">
    <div class="text-center mb-4">
      <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-4 shadow"
           style="width: 58px; height: 58px; background: linear-gradient(135deg, #4f46e5, #0ea5e9); font-size: 1.65rem; color: #fff;">
        <i class="bi bi-rocket-takeoff-fill"></i>
      </div>
      <h4 class="fw-bold mb-1">Horeca Suite</h4>
      <p class="small mb-0" style="color: #94a3b8;">Accedi al tuo Sales Cockpit</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="username" class="form-label small text-uppercase" style="letter-spacing: 0.06em;">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Inserisci username" required autofocus>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small text-uppercase" style="letter-spacing: 0.06em;">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-4 fw-bold fs-6">
        <i class="bi bi-box-arrow-in-right me-2"></i>Accedi al Gestionale
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
  {{ super() }}
{% endblock %}
